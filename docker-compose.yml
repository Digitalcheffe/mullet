services:
  mullet:
    build: .
    image: mullet:latest
    # PORT drives the host mapping and the container's listen port together.
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # Named volume (not a bind mount) so data survives a GitOps redeploy
    # that re-clones the repo checkout. DB, uploads, and logs all live
    # under /data so one volume covers everything.
    volumes:
      - mullet_data:/data
    environment:
      - PORT=${PORT:-8080}
      - DB_PATH=/data/mullet.db
      - UPLOADS_DIR=/data/uploads
      - LOG_PATH=/data/logs/mullet.log
      # Outgoing mail (password reset, notifications). Seeds the SMTP
      # setting on first boot only -- an admin edit via Settings takes
      # over after that. Leave SMTP_HOST empty to configure via Settings
      # instead.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - SMTP_TLS_MODE=${SMTP_TLS_MODE:-starttls}
      # Secrets for plugins that reference ${VAR} in their setup fields
      - OWM_API_KEY=${OWM_API_KEY:-}
      - HA_TOKEN=${HA_TOKEN:-}
      # Local dev only: skips setup/login entirely. Never set this in a
      # real deployment.
      # - AUTH_DISABLED=true
    restart: unless-stopped

volumes:
  # Inspect with `docker volume inspect mullet_data` to find the real
  # host path for a manual backup.
  mullet_data:

services:
  mullet:
    build: .
    image: mullet:latest
    # A single PORT variable (set it in the shell or a .env file next to
    # this file, e.g. `PORT=9000 docker-compose up`) drives both sides
    # of the mapping and the container's own listen port together --
    # keep them referencing the same ${PORT:-8080} rather than hardcoding
    # the container side, or the app would end up listening somewhere
    # the host mapping doesn't actually point at.
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # A named volume, not a relative bind mount (`./data:/data`) --
    # a relative path resolves against wherever `docker compose` is
    # actually run from, which for a Portainer "Git repository" stack
    # (or any GitOps-style deploy) is Portainer's own managed clone of
    # this repo. If Portainer re-clones or recreates that checkout on
    # redeploy, a relative ./data bind mount gets wiped right along
    # with it -- taking the database with it, even though nothing about
    # the deployment "failed." A named volume lives in Docker's own
    # storage, completely decoupled from the repo checkout, so it
    # survives a redeploy/re-clone regardless of how the stack's git
    # checkout itself is managed. Everything that needs to persist --
    # the database, uploaded files, and logs -- already lives under one
    # /data (DB_PATH/UPLOADS_DIR/LOG_PATH below), so one volume covers
    # all of it.
    volumes:
      - mullet_data:/data
    environment:
      - PORT=${PORT:-8080}
      - DB_PATH=/data/mullet.db
      # Admin-uploaded files (e.g. a theme's background image, issue
      # #58) and the log file below -- deliberately under the same
      # mullet_data volume as the database rather than a second one, so
      # they all persist together. No need to change these.
      - UPLOADS_DIR=/data/uploads
      - LOG_PATH=/data/logs/mullet.log
      # Outgoing mail (password reset, notification emails -- issue
      # #78/#112). Seeds the server's SMTP setting on first boot only;
      # once an admin edits it via Settings, that takes over as the
      # permanent source of truth and these are ignored on later
      # restarts. Leave SMTP_HOST empty to skip seeding entirely and
      # configure it via Settings instead.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - SMTP_TLS_MODE=${SMTP_TLS_MODE:-starttls}
      # Secrets for plugins that reference ${VAR} in their setup fields
      - OWM_API_KEY=${OWM_API_KEY:-}
      - HA_TOKEN=${HA_TOKEN:-}
      # Local dev only: skips setup/login entirely. Never set this in a
      # real deployment.
      # - AUTH_DISABLED=true
    restart: unless-stopped

volumes:
  # Named (not bind-mounted) precisely so it survives a redeploy
  # regardless of where/how the stack's own files are checked out --
  # see the comment on the service's own `volumes:` above. Inspect it
  # directly with `docker volume inspect mullet_data` if you need the
  # real host path for a manual backup.
  mullet_data:
